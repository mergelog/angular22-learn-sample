<h2>resource() / rxResource()</h2>
<button type="button" (click)="nextUser()">次のユーザーを取得</button>
<p>
  resource:
  @if (promiseUser.isLoading()) {
    読み込み中
  } @else {
    {{ promiseUser.value()?.name }}
  }
</p>
<p>
  rxResource:
  @if (observableUser.isLoading()) {
    読み込み中
  } @else {
    {{ observableUser.value()?.name }}
  }
</p>
<app-p01-signals-navi />
