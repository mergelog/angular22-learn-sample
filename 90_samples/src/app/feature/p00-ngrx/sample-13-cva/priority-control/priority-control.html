<div class="priority" role="radiogroup" aria-label="優先度">
  @for (option of options; track option.value) {
    <button
      type="button"
      role="radio"
      [class.selected]="value() === option.value"
      [attr.aria-checked]="value() === option.value"
      [disabled]="disabled()"
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
