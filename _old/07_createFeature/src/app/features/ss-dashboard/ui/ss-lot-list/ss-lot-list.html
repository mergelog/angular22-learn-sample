<table>
  <thead>
    <tr>
      <th scope="col">Lot Name</th>
      <th scope="col">Wafer Count</th>
      <th scope="col">Accuracy</th>
      <th scope="col">Status</th>
      <th scope="col">Updated At</th>
    </tr>
  </thead>
  <tbody>
    @for (lot of items(); track lot.lotName) {
      <tr>
        <td>{{ lot.lotName }}</td>
        <td>{{ lot.waferCount }}</td>
        <td>{{ lot.accuracy }}%</td>
        <td>{{ lot.status }}</td>
        <td>{{ lot.updatedAt }}</td>
      </tr>
    }
  </tbody>
</table>
