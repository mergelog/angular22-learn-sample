<section class="cafe-table-output" aria-label="テーブル詳細">
  @if (selectedTable(); as table) {
    <app-cafe-info-header
      [table]="table"
      [generatedAt]="generatedAt()"
      (closeRequested)="closePanel()"
      (saveRequested)="saveTable($event)"
    />
    <router-outlet />
  } @else if (loading()) {
    <div class="detail-state" aria-live="polite">
      <span class="spinner" aria-hidden="true"></span>
      <strong>テーブル詳細を読み込んでいます</strong>
    </div>
  } @else if (dashboard()) {
    <div class="detail-state" role="status">
      <strong>テーブルが見つかりません</strong>
      <span>「{{ tableNumber() }}」に一致するテーブルはありません。</span>
      <button type="button" (click)="closePanel()">一覧へ戻る</button>
    </div>
  }
</section>
