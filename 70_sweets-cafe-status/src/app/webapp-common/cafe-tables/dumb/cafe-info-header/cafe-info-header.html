<header class="info-header">
  <div>
    <p class="eyebrow">TABLE DETAILS</p>
    <h2>{{ table().tableNumber }}</h2>
    <p class="summary">{{ table().classification }} · {{ table().status }}</p>
    <p class="snapshot-time">取得時刻 {{ (generatedAt() | date: 'yyyy/MM/dd HH:mm:ss') ?? '—' }}</p>
  </div>

  <div class="header-actions">
    @if (!editing()) {
      <button type="button" class="edit-button" (click)="startEditing()">編集</button>
    }

    <button
      type="button"
      class="close-button"
      aria-label="詳細を閉じる"
      (click)="closeRequested.emit()"
    >
      ×
    </button>
  </div>
</header>

@if (editing()) {
  <form class="edit-form" aria-label="テーブルの編集" [formGroup]="form" (ngSubmit)="save()">
    <label class="field">
      <span class="field-label">状態</span>
      <select formControlName="status">
        @for (status of statuses; track status) {
          <option [value]="status">{{ status }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span class="field-label">人数</span>
      <input type="number" inputmode="numeric" min="0" step="1" formControlName="people" />
      @if (form.controls.people.invalid && form.controls.people.dirty) {
        <span class="field-error" role="alert">人数は0以上の整数で入力してください。</span>
      }
    </label>

    <label class="field">
      <span class="field-label">会計金額（円）</span>
      <input type="number" inputmode="numeric" min="0" step="1" formControlName="billingAmount" />
    </label>

    <div class="form-actions">
      <button type="button" class="cancel-button" (click)="cancelEditing()">キャンセル</button>
      <button type="submit" class="save-button">保存</button>
    </div>
  </form>
}
